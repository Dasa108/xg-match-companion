name: Deploy to GitHub Pages

# Builds app/ and publishes it to GitHub Pages. Triggered on every push to m1-model (this
# repo's default branch) that touches the app, plus manual runs from the Actions tab.
on:
  push:
    branches: [m1-model]
    paths:
      - "app/**"
      - "models/**"
      - "training/feature_fixtures.json"
      - "training/psxg_feature_fixtures.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels an in-flight one rather than queuing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Build
        working-directory: app
        run: npm run build
        env:
          # Only this CI build targets the Pages subpath; local builds stay at root "/"
          # so `npm run preview` keeps working — see the comment in vite.config.ts.
          GH_PAGES: "true"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
