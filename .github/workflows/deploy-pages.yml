name: Deploy to GitHub Pages

# Builds app/ and publishes it to GitHub Pages. Triggered on every push to m1-model (this
# repo's default branch) that touches the app, plus manual runs from the Actions tab.
on:
  push:
    branches: [m1-model]
    paths:
      - "app/**"
      - "models/**"
      - "training/feature_fixtures.json"
      - "training/psxg_feature_fixtures.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels an in-flight one rather than queuing.
concurrency:
  group: pages
  cancel-in-progress: true

# Node 24 for the build, and every action pinned to a release that itself runs on Node 24
# (Node 20 is deprecated on GitHub-hosted runners; the old majors were being force-run on 24
# with a warning on every deploy). Keep app/ tested on the same version: see /.nvmrc.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # onnxruntime-node's postinstall downloads a prebuilt native binary from GitHub
      # releases — a real transient-network failure hit this exact step once already
      # (ETIMEDOUT/ENETUNREACH on the runner), unrelated to any app change, and blocked
      # the whole deploy. A cheap retry wrapper turns a runner network blip into a delay
      # instead of a failed deploy.
      - name: Install
        working-directory: app
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $attempt/3)"
            [ "$attempt" = "3" ] && exit 1
            sleep 10
          done
      - name: Build
        working-directory: app
        run: npm run build
        env:
          # Only this CI build targets the Pages subpath; local builds stay at root "/"
          # so `npm run preview` keeps working — see the comment in vite.config.ts.
          GH_PAGES: "true"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
